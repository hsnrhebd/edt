name: Build Novel EdgeTunnel From ZIP

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OBFUSCATION_VERSION: "novel-v1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate builder ZIP
        run: |
          set -e

          echo "Searching for novel builder ZIP..."

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname "*novel-builder*.zip" \
              -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No novel builder ZIP found."
            echo
            echo "Files in repository root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple novel builder ZIP files found:"
            printf '%s\n' "${ZIPS[@]}"
            echo
            echo "Please keep only one *novel-builder*.zip in repository root."
            exit 1
          fi

          BUILDER_ZIP="${ZIPS[0]}"

          if [ ! -s "$BUILDER_ZIP" ]; then
            echo "ERROR: Builder ZIP is empty:"
            echo "$BUILDER_ZIP"
            exit 1
          fi

          echo "Builder ZIP found:"
          ls -lh "$BUILDER_ZIP"

          echo "BUILDER_ZIP=$BUILDER_ZIP" >> "$GITHUB_ENV"

      - name: Extract builder
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/.novel-builder"
          mkdir -p "$GITHUB_WORKSPACE/.novel-builder"

          unzip -q "$BUILDER_ZIP" \
            -d "$GITHUB_WORKSPACE/.novel-builder"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/.novel-builder" \
            -maxdepth 4 \
            -type f \
            -print

      - name: Locate builder script
        run: |
          set -e

          BUILDER="$(find "$GITHUB_WORKSPACE/.novel-builder" \
            -type f \
            -name "novel-build.mjs" \
            -print -quit)"

          if [ -z "$BUILDER" ]; then
            echo "ERROR: novel-build.mjs not found inside builder ZIP."
            exit 1
          fi

          echo "Builder script:"
          echo "$BUILDER"

          echo "BUILDER=$BUILDER" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Download latest EdgeTunnel
        run: |
          set -e

          curl -fL \
            https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js \
            -o origin-new.js

          if [ ! -s origin-new.js ]; then
            echo "ERROR: Downloaded EdgeTunnel source is empty."
            exit 1
          fi

          echo "Latest EdgeTunnel source:"
          wc -c origin-new.js

      - name: Build novel version
        run: |
          set -e

          echo "Running builder..."
          node "$BUILDER" origin-new.js _worker.js

          if [ ! -s _worker.js ]; then
            echo "ERROR: Builder did not generate _worker.js."
            exit 1
          fi

          echo "Generated Worker:"
          wc -c _worker.js

      - name: Validate generated Worker
        run: |
          set -e

          echo "Checking JavaScript syntax..."
          node --check _worker.js

          echo "Checking Worker structure..."

          grep -q "export default" _worker.js || {
            echo "ERROR: export default missing."
            exit 1
          }

          grep -q "const _m=" _worker.js || {
            echo "ERROR: _m index table missing."
            exit 1
          }

          grep -q "new _F" _worker.js || {
            echo "ERROR: startup loader missing."
            exit 1
          }

          echo "Worker validation passed."

      - name: Show build statistics
        run: |
          echo "========== BUILD STATISTICS =========="

          echo "Original source:"
          wc -c origin-new.js

          echo
          echo "Generated Worker:"
          wc -c _worker.js

          echo
          echo "Container table:"
          grep -o "const _b=" _worker.js | wc -l

          echo
          echo "Index table:"
          grep -o "const _m=" _worker.js | wc -l

          echo
          echo "======================================"

      - name: Update source files
        run: |
          set -e

          mv origin-new.js origin.js

          echo "$OBFUSCATION_VERSION" > .novel-version

          echo "Novel builder version:"
          cat .novel-version

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "chore: update EdgeTunnel novel build"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "_worker.js origin.js .novel-version"
